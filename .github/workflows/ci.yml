name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # flutter-gate — analyze + test + publish dry-run for pulse_theme.
  # Mirrors the willink-design-system flutter-gate so a broken package is
  # caught on every PR, not only at publish-tag time.
  # ---------------------------------------------------------------------------
  flutter-gate:
    name: flutter-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          # Pinned exact: alchemist golden snapshots are Flutter-version
          # sensitive (widget layout metrics), so the committed CI goldens must
          # be generated + verified on ONE version. Bump this pin and rerun
          # `flutter test --update-goldens` together. (Satisfies pubspec
          # sdk: ^3.7.0 — 3.44.2 ships Dart 3.12.)
          flutter-version: "3.44.2"

      - name: Install dependencies
        run: flutter pub get

      # example/ is a SEPARATE Flutter package (its own pubspec.yaml), shipped
      # in the published archive so pub.dev renders an example tab. The root
      # `flutter analyze` discovers it as its own analysis context, so unless it
      # has been resolved first every `package:flutter` / `package:pulse_theme`
      # import inside example/lib is reported as "Target of URI doesn't exist"
      # and the root analyze fails. Resolving example/ BEFORE the root analyze
      # is what keeps this gate green.
      #
      # The presence check keeps the workflow valid on refs without example/
      # (older branches, or a revert) instead of failing on a missing directory.
      - name: Detect example app
        id: example
        run: |
          set -euo pipefail
          if [ -f example/pubspec.yaml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No example/pubspec.yaml — skipping example resolution + analyze."
          fi

      - name: Install example dependencies
        if: steps.example.outputs.present == 'true'
        working-directory: example
        run: flutter pub get

      # `dart format` compliance is worth 10 pana points, and nothing else in
      # this pipeline notices it: `flutter analyze` is clean on unformatted
      # code. One file in lib/ shipped unformatted in 0.6.0 and pana 0.23.15
      # deducted those points locally. pub.dev still scored 0.6.0 160/160 — its
      # analyzer runs a different SDK, and formatter output is SDK-dependent —
      # so this gate is about staying consistent with the toolchain THIS repo
      # pins, not about a score that already dropped. Runs before the slower
      # gates because it is the cheapest way to catch that class.
      - name: Check formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze (all severities)
        run: flutter analyze

      # Belt and braces: analyze example/ in its own right so its own
      # analysis_options.yaml (app-level lints) is honoured, independent of how
      # the root analyzer happens to treat nested packages.
      - name: Analyze example (all severities)
        if: steps.example.outputs.present == 'true'
        working-directory: example
        run: flutter analyze

      - name: Test (incl. alchemist CI goldens)
        run: flutter test

      # The example ships inside the published archive and is the first thing a
      # consumer copies, so its smoke test is a gate, not decoration: it renders
      # every tab and drives the bottom-sheet -> snack-bar round trip. Without
      # this step an API change could leave a broken example on pub.dev while
      # the root suite stays green.
      - name: Test example (gallery smoke test)
        if: steps.example.outputs.present == 'true'
        working-directory: example
        run: flutter test

      - name: Dry-run publish (pub.dev compatibility sanity check)
        run: dart pub publish --dry-run

  # ---------------------------------------------------------------------------
  # token-codegen-gate — web ↔ mobile token parity.
  # Regenerates lib/src/tokens/pulse_tokens.dart from the PUBLISHED
  # @willink-labs/tokens DTCG contract (pinned by tool/package-lock.json) and
  # fails on any drift from the committed output. This is the hard parity gate
  # (no skip-when-JSON-unreachable escape hatch) that replaces the old Flutter
  # hand-mirror + skippable sync test. Mirrors css-tokens' check-output-parity.
  # ---------------------------------------------------------------------------
  token-codegen-gate:
    name: token-codegen-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install token contract (pinned @willink-labs/tokens)
        run: npm --prefix tool ci

      - name: Regenerate tokens from the published DTCG contract
        run: node tool/generate_tokens.mjs

      - name: Fail on drift (committed Dart must match the SSOT)
        run: |
          if ! git diff --exit-code -- lib/src/tokens/pulse_tokens.dart; then
            echo "::error::lib/src/tokens/pulse_tokens.dart is stale vs @willink-labs/tokens. Run \`npm --prefix tool ci && node tool/generate_tokens.mjs\` and commit."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # css-codegen-gate — the same drift check for the web binding.
  #
  # `tool/generate_css.mjs` emits web/dist/ (the @willink-labs/pulse npm
  # package) from the SAME published contract token-codegen-gate uses. Kept as
  # its own job rather than extra steps on that one so a red check names which
  # binding drifted.
  #
  # Note what this gate can and cannot see: it proves the committed CSS matches
  # the contract, exactly as its sibling proves the committed Dart does. Neither
  # can prove the two bindings agree with EACH OTHER — both could drift the same
  # way and stay green. That is test/web_parity_test.dart's job, and it runs in
  # flutter-gate above.
  # ---------------------------------------------------------------------------
  css-codegen-gate:
    name: css-codegen-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install token contract (pinned @willink-labs/tokens)
        run: npm --prefix tool ci

      - name: Regenerate the web binding from the published DTCG contract
        run: node tool/generate_css.mjs

      - name: Fail on drift (committed CSS must match the SSOT)
        run: |
          if ! git diff --exit-code -- web/dist; then
            echo "::error::web/dist is stale vs @willink-labs/tokens. Run \`npm --prefix tool ci && node tool/generate_css.mjs\` and commit."
            exit 1
          fi

      # A generated file that git does not track is a file the drift check above
      # cannot see: `git diff` reports nothing for an untracked path, so a new
      # emitter output would ship to npm unreviewed and unverified.
      - name: Fail on untracked generated output
        run: |
          set -euo pipefail
          untracked="$(git ls-files --others --exclude-standard -- web/dist)"
          if [ -n "$untracked" ]; then
            echo "::error::The emitter produced files git is not tracking:"
            echo "$untracked"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # package-score — the two quality claims the README makes about this package,
  # enforced before merge instead of observed after publish.
  #
  # Both existed as "we check it by hand sometimes", and both had already
  # regressed unnoticed: two broken dartdoc references shipped in 0.5.0 (fixed
  # in 0.5.1), and an unformatted file in lib/ shipped in 0.6.0 (-10 pana
  # points). A gate that runs after the release is not a gate.
  # ---------------------------------------------------------------------------
  package-score:
    name: package-score
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: "3.44.2"

      - name: Install dependencies
        run: flutter pub get

      # `dart doc` EXITS 0 EVEN WITH WARNINGS — verified, not assumed. So the
      # naive `run: dart doc --dry-run` would be a gate that can never fail.
      # Parse the summary instead, and fail closed if the summary line itself
      # is missing: a changed output format must be a loud failure, never a
      # silent pass.
      - name: Doc references resolve (dart doc)
        run: |
          set -euo pipefail
          dart doc --dry-run 2>&1 | tee /tmp/dartdoc.log
          summary="$(grep -oE 'Found [0-9]+ warnings? and [0-9]+ errors?\.' /tmp/dartdoc.log | tail -1 || true)"
          if [ -z "$summary" ]; then
            echo "::error::Could not find the 'Found N warnings and M errors.' summary in dart doc output — its format changed, so this gate can no longer verify anything. Fix the gate."
            exit 1
          fi
          echo "dart doc: $summary"
          if [ "$summary" != "Found 0 warnings and 0 errors." ]; then
            echo "::error::dart doc reported unresolved references. They render as broken links in the API docs on pub.dev."
            grep -iE 'warning|error' /tmp/dartdoc.log || true
            exit 1
          fi

      # Pinned exactly, for the same reason the Flutter version is: a pana
      # release that adds or reweights a check would otherwise turn CI red on a
      # PR that changed nothing. Bumping this pin is a deliberate change.
      - name: Install pana
        run: dart pub global activate pana 0.23.15

      # --exit-code-threshold 0 = the score must stay perfect. The package is at
      # 160/160 and every deduction pana reports is actionable (formatting,
      # docs, platform declarations, dependency freshness), so there is no band
      # of "acceptable" loss to allow for.
      - name: pana score (must stay 160/160)
        run: |
          set -euo pipefail
          dart pub global run pana --no-warning --exit-code-threshold 0 . 2>&1 | tee /tmp/pana.log
          grep -E '^Points:' /tmp/pana.log || true
