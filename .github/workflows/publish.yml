name: Publish pulse_theme to pub.dev

# Triggered by version tags `v*` (e.g. v0.5.1).
#
# ⚠️ One-time setup — see doc/releasing.md. pub.dev cannot enable "Automated
# publishing" for a package that does not exist yet, so the FIRST version
# (0.5.0) is published manually with `dart pub publish` from a workstation and
# only then is this repo trusted as a publisher. Until that is done the final
# publish step cannot authenticate — everything before it (tag/pubspec
# agreement, analyze, test, dry-run) still runs as a gate.
# Ref: https://dart.dev/tools/pub/automated-publishing
#
# `workflow_dispatch` is kept as a *gate-only* trigger (analyze / test /
# dry-run). It never publishes: pub.dev rejects OIDC publishing from a run that
# was not triggered by pushing a git tag.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    name: dart pub publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for pub.dev OIDC Trusted Publisher
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # BOTH toolchain actions are required, and the order is deliberate.
      #
      # * dart-lang/setup-dart is the only thing that mints the pub.dev OIDC
      #   credential: when ACTIONS_ID_TOKEN_REQUEST_URL is present it calls
      #   core.getIDToken('https://pub.dev'), exports PUB_TOKEN and runs
      #   `dart pub token add https://pub.dev --env-var PUB_TOKEN`.
      #   subosito/flutter-action does none of that, so it cannot replace it.
      # * The token lands in the shared pub *config* dir
      #   (~/.config/dart/pub-tokens.json), not in PUB_CACHE, so every Dart —
      #   standalone or Flutter-bundled — picks it up afterwards.
      # * Each action prepends its own bin/ to PATH, so whichever runs LAST owns
      #   `dart`. flutter-action runs last on purpose: the `dart` that executes
      #   pub get / dry-run / publish is then the one bundled with the pinned
      #   Flutter 3.44.2 — byte-for-byte the toolchain ci.yml already proves
      #   green on every PR, instead of a floating standalone SDK.
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          # Match ci.yml's pin (golden-snapshot stability). 3.44.2 ships Dart
          # 3.12, satisfying pubspec sdk: ^3.7.0.
          flutter-version: '3.44.2'

      # Tag/pubspec agreement + pre-release awareness. pub.dev has no dist-tags:
      # a pre-release version (X.Y.Z-beta.N) is excluded from default
      # ^-constraint resolution, so existing consumers never auto-upgrade to it.
      - name: Verify tag/pubspec agreement
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PUBSPEC_VERSION="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          if [ "$TAG_VERSION" != "$PUBSPEC_VERSION" ]; then
            echo "::error::Tag/pubspec mismatch: tag '$TAG_VERSION' vs pubspec '$PUBSPEC_VERSION'. Refusing to publish."
            exit 1
          fi
          if [[ "$TAG_VERSION" == *-* ]]; then
            echo "Pre-release '$TAG_VERSION' — pub.dev excludes it from default ^-constraint resolution."
          fi

      # Idempotency guard.
      #
      # A pub.dev version is permanent and cannot be re-uploaded, so a tag for a
      # version that is already published (the manually released 0.5.0, or a
      # re-pushed tag) would otherwise die on "version already exists" and leave
      # a red run behind. Ask pub.dev first and skip instead.
      #
      # Failure policy — publishing is irreversible, so an undetermined answer
      # is never resolved by guessing:
      #   200 + version present  -> skip the publish step, job stays green
      #   200 + version absent   -> publish
      #   404 (package unknown)  -> publish (this is the very first release)
      #   transport error / 5xx / anything else -> FAIL the job.
      # We refuse to fail *open* (publish blind, risking a red publish or a
      # wrong upload) and equally refuse to fail *closed* (silently skip, so a
      # release tag would publish nothing and still look green). A human re-runs
      # the job once pub.dev answers.
      - name: Check whether this version is already on pub.dev
        id: pubdev
        env:
          PACKAGE: pulse_theme
        run: |
          set -euo pipefail

          VERSION="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read 'version:' from pubspec.yaml. Refusing to publish."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # No `-f`: HTTP error codes must reach us as data (404 is meaningful),
          # so curl only fails here on a genuine transport error. --retry covers
          # timeouts/429/5xx so a blip does not turn into a hard stop.
          if HTTP_CODE="$(curl -sS \
              --retry 3 --retry-delay 3 --retry-all-errors --max-time 30 \
              -H 'Accept: application/vnd.pub.v2+json' \
              -o pubdev-response.json -w '%{http_code}' \
              "https://pub.dev/api/packages/${PACKAGE}")"; then
            :
          else
            echo "::error::Could not reach https://pub.dev/api/packages/${PACKAGE} (curl transport failure). Not publishing and not silently skipping — re-run this job once pub.dev is reachable."
            exit 1
          fi

          case "$HTTP_CODE" in
            200)
              if ! jq -e 'type == "object" and (.versions | type == "array")' pubdev-response.json >/dev/null 2>&1; then
                echo "::error::pub.dev returned 200 but the body is not a package document with a versions[] array. Refusing to publish on an answer we cannot parse."
                exit 1
              fi
              PUBLISHED="$(jq -r '.versions | length' pubdev-response.json)"
              if [ "$(jq -r --arg v "$VERSION" '[.versions[].version] | any(. == $v)' pubdev-response.json)" = "true" ]; then
                echo "skip=true" >> "$GITHUB_OUTPUT"
                echo "::notice::${PACKAGE} ${VERSION} is already published on pub.dev — skipping the publish step. pub.dev never accepts the same version twice; this is the expected outcome for a tag that documents an already-released version (e.g. the manually published 0.5.0)."
                echo "- Publish **skipped**: \`${PACKAGE} ${VERSION}\` already exists on pub.dev (${PUBLISHED} published versions)." >> "$GITHUB_STEP_SUMMARY"
              else
                echo "skip=false" >> "$GITHUB_OUTPUT"
                echo "${PACKAGE} ${VERSION} is not among the ${PUBLISHED} published versions — will publish."
                echo "- Publish **armed**: \`${PACKAGE} ${VERSION}\` is new on pub.dev." >> "$GITHUB_STEP_SUMMARY"
              fi
              ;;
            404)
              echo "skip=false" >> "$GITHUB_OUTPUT"
              echo "::notice::${PACKAGE} is not on pub.dev yet (HTTP 404) — treating ${VERSION} as the first release."
              echo "- Publish **armed**: \`${PACKAGE}\` is not yet on pub.dev (first release)." >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::error::Unexpected HTTP ${HTTP_CODE} from pub.dev for ${PACKAGE}. Refusing to publish — a wrong answer here is unrecoverable, because a published version can never be replaced."
              exit 1
              ;;
          esac

      - name: Install dependencies
        run: flutter pub get

      # example/ is a separate Flutter package with its own pubspec. The root
      # `flutter analyze` walks into it and would report unresolved
      # `package:` imports unless it has been resolved first. Guarded so the
      # workflow keeps working on refs where example/ does not exist.
      - name: Detect example app
        id: example
        run: |
          set -euo pipefail
          if [ -f example/pubspec.yaml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No example/pubspec.yaml — skipping example resolution."
          fi

      - name: Install example dependencies
        if: steps.example.outputs.present == 'true'
        working-directory: example
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Dry-run publish (sanity)
        run: dart pub publish --dry-run

      - name: Publish to pub.dev (OIDC Trusted Publisher)
        # pub.dev only accepts automated publishing from a run triggered by
        # pushing a git tag, so a workflow_dispatch run is a gate, never a
        # release. `skip` comes from the pub.dev existence check above; the step
        # never runs on an undetermined answer, because that check exits 1.
        if: >-
          github.event_name == 'push'
          && startsWith(github.ref, 'refs/tags/')
          && steps.pubdev.outputs.skip == 'false'
        run: dart pub publish --force

      - name: Report a gate-only run
        if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
        run: |
          echo "::notice::Gate-only run (${{ github.event_name }} on ${{ github.ref }}). Analyze/test/dry-run executed; nothing was published. pub.dev rejects automated publishing that is not triggered by a git tag push."
