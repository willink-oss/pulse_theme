name: pulse_theme
description: PULSE — i-Willink's mobile-first design system for Flutter. Material 3 ThemeData factories plus components, code-generated from DTCG design tokens.
version: 0.9.0
homepage: https://github.com/willink-oss/pulse_theme
repository: https://github.com/willink-oss/pulse_theme
issue_tracker: https://github.com/willink-oss/pulse_theme/issues
documentation: https://github.com/willink-oss/pulse_theme/blob/main/README.md

# pub.dev topics: lowercase alnum + hyphen, 2-32 chars, must start with a letter, max 5.
topics:
  - design-system
  - material-design
  - theme
  - ui
  - design-tokens

# Pure Dart/Flutter — no platform channels, no dart:io/dart:ffi/dart:html anywhere
# in lib/ (only package:flutter material/widgets/services). All 6 targets supported;
# matches pana's inferred "Supports 6 of 6 possible platforms".
platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ^3.7.0
  # Color.withValues (used across lib/) shipped in Flutter 3.27 / Dart 3.6.
  # The Dart bound above already forces a newer Flutter, but this stated the
  # wrong minimum, which is misleading metadata to freeze into 1.0.
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  alchemist: ^0.14.0

flutter:
  uses-material-design: true
